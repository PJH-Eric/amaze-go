name: Deploy front end to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
      - name: 注入 server URL（repo variable GAME_SERVER_URL，值為 Render 後端 HTTPS URL）
        run: |
          sed -i "s#__GAME_SERVER_URL__#${GAME_SERVER_URL}#" public/js/config.js
        env: { GAME_SERVER_URL: '${{ vars.GAME_SERVER_URL }}' }
      - uses: actions/configure-pages@v5
      - name: 驗證並注入 GA4 與 SEO
        run: node tests/seo.js && node scripts/inject-seo.js

      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: d
        uses: actions/deploy-pages@v4
