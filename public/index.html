<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe9f1">
<title>箭頭解密 Amaze GO｜免費線上益智小遊戲</title>
<meta name="description" content="點一點，讓箭頭飛出棋盤！免費、免下載，手機平板都能玩的可愛箭頭解謎遊戲。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<button class="gear" id="gearBtn" type="button" aria-label="設定" aria-haspopup="dialog">
  <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="#fff"><rect x="10.5" y="1.5" width="3" height="5" rx="1.5"/><rect x="10.5" y="17.5" width="3" height="5" rx="1.5"/><rect x="1.5" y="10.5" width="5" height="3" rx="1.5"/><rect x="17.5" y="10.5" width="5" height="3" rx="1.5"/><rect x="10.5" y="1.5" width="3" height="5" rx="1.5" transform="rotate(45 12 12)"/><rect x="10.5" y="17.5" width="3" height="5" rx="1.5" transform="rotate(45 12 12)"/><rect x="1.5" y="10.5" width="5" height="3" rx="1.5" transform="rotate(45 12 12)"/><rect x="17.5" y="10.5" width="5" height="3" rx="1.5" transform="rotate(45 12 12)"/><circle cx="12" cy="12" r="6.5"/></g><circle cx="12" cy="12" r="3" fill="#ff8fb1"/></svg>
</button>

<main id="app">
  <section id="home" class="screen" aria-labelledby="homeTitle">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 160 90"><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="14"><path d="M20 70V40h50" stroke="#ff8fb1"/><path d="M60 70h60V25" stroke="#7fd6c2"/><path d="M95 45h45" stroke="#ffc26b"/></g><g><path d="M70 28l16 12-16 12z" fill="#ff8fb1"/><path d="M108 28l12-16 12 16z" fill="#7fd6c2"/><path d="M138 33l16 12-16 12z" fill="#ffc26b"/></g></svg>
    </div>
    <h1 id="homeTitle">箭頭解密</h1>
    <p class="sub">Amaze GO・點一點，讓箭頭飛出去</p>
    <div class="panel">
      <h2>選擇難度</h2>
      <div class="chips" id="diffChips" role="radiogroup" aria-label="難度"></div>
      <h2>選擇關卡</h2>
      <div class="levels" id="levelGrid"></div>
    </div>
    <div class="row">
      <button class="btn ghost" id="howBtn" type="button">怎麼玩</button>
      <button class="btn ghost" type="button" disabled aria-disabled="true" title="線上同盤競速開發中">線上競速（開發中）</button>
    </div>
  </section>

  <section id="game" class="screen" hidden aria-label="遊戲">
    <header class="topbar">
      <button class="btn small" id="backBtn" type="button">← 返回</button>
      <div class="title" id="gameTitle"></div>
      <div class="hearts" id="hearts" role="img"></div>
    </header>
    <div class="boardWrap"><svg id="board" role="group" aria-label="棋盤"></svg></div>
    <div class="live" id="live" aria-live="polite"></div>
    <footer class="bottombar">
      <button class="btn" id="hintBtn" type="button">提示 <span id="hintCount"></span></button>
      <button class="btn" id="restartBtn" type="button">重來</button>
    </footer>
    <div class="result" id="result" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="card">
        <div class="medal" id="resultIcon" aria-hidden="true"></div>
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>
        <div class="stack">
          <button class="btn primary" id="againBtn" type="button">再來一局</button>
          <button class="btn" id="roomBtn" type="button" aria-disabled="true">回到房間</button>
          <button class="btn ghost" id="homeBtn" type="button">回到首頁</button>
        </div>
        <p class="note" id="roomNote" hidden>單機模式沒有房間，這顆在線上版才會啟用。</p>
      </div>
    </div>
  </section>
</main>

<div class="modal" id="how" hidden role="dialog" aria-modal="true" aria-labelledby="howTitle">
  <div class="card">
    <h2 id="howTitle">怎麼玩</h2>
    <ol class="steps">
      <li>點一支箭頭，它會朝<b>箭頭尖端的方向</b>直直飛出去。</li>
      <li>前面有別的箭頭擋住就飛不出去，會撞回來並扣一顆愛心。</li>
      <li>先飛出沒被擋的，再慢慢清出路，把所有箭頭都送出棋盤就過關！</li>
      <li>卡住時按「提示」，會閃出一支現在可以飛的箭頭。</li>
    </ol>
    <button class="btn primary" data-close type="button">知道了</button>
  </div>
</div>

<div class="modal" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <h2 id="setTitle">設定</h2>
    <div class="set" id="setList"></div>
    <div class="row">
      <button class="btn ghost" id="resetSet" type="button">恢復預設</button>
      <button class="btn primary" data-close type="button">完成</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/rules.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
